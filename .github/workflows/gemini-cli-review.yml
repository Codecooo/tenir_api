name: Gemini CLI Review Automation

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  gemini-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini CLI Action
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.3
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Review the code changes in this pull request and comment with any suggestions or issues refer to AGENTS.md for guidelines."

      - name: Post Comment to Pull Request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_OUTPUT: ${{ steps.gemini.outputs.response }}
        run: |
          if [ -n "$REVIEW_OUTPUT" ]; then
            gh pr comment "$PR_URL" --body "$REVIEW_OUTPUT"
          else
            echo "No output returned from Gemini CLI step."
          fi